<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybi Admin | Acceso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <form class="login-card" id="login-form">
        <img src="../img/cybi-logo.jpeg" alt="Cybi">
        <h1>Panel privado</h1>
        <p>Las entrevistas, gráficos y casos no se publican. Solo el equipo autorizado entra acá.</p>
        <div class="field">
            <label for="admin-pass">Clave de administración</label>
            <input id="admin-pass" type="password" autocomplete="current-password" required placeholder="Contraseña">
        </div>
        <p class="help" id="login-help"></p>
        <button class="btn" type="submit" style="width:100%; justify-content:center;"><i class="fa-solid fa-unlock-keyhole"></i> Entrar al panel</button>
    </form>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
