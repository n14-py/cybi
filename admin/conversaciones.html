<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybi Admin | Conversaciones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="conversaciones">
    <aside id="sidebar"></aside>
    <div class="admin-wrap">
        <header id="topbar"></header>
        <main class="page">
            <div id="c-status" class="status">Cargando...</div>
            <section class="filters">
                <div class="field"><label>Buscar</label><input id="c-q" placeholder="ciudad o colegio"></div>
                <label class="field" style="flex-direction:row;align-items:center;gap:10px;">
                    <input id="c-alertas" type="checkbox">
                    <span>Solo severidad 4 o 5</span>
                </label>
                <button class="btn ghost" id="c-print" type="button"><i class="fa-solid fa-print"></i> Imprimir vista</button>
            </section>
            <section class="split">
                <div class="list" id="c-list"></div>
                <article class="transcript">
                    <div class="transcript-head" id="t-head">Elegí una conversación</div>
                    <div class="transcript-body" id="t-body"><p class="empty">Nadie del sitio público puede leer esto. Solo el equipo.</p></div>
                </article>
            </section>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/conversaciones.js"></script>
</body>
</html>
